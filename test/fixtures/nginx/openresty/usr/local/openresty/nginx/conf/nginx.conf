# OpenResty-style config: lua blocks, variables in braces, quotes and escapes.
worker_processes auto;
env ZETCERT_TEST;

events { worker_connections 1024; }

http {
    lua_package_path "/usr/local/openresty/lualib/?.lua;;";
    init_by_lua_block {
        -- braces in Lua must not end the block: }
        local config = { upstreams = { "a", "b" }, pattern = "[{}]" }
        cache = ngx.shared.cache  --[[ a long
        comment with } in it ]]
        local s = [==[
          server { this is not nginx }
        ]==]
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    log_format main '$remote_addr - "${request}" \'quoted\' "$status"';

    include sites/*.conf;
}
