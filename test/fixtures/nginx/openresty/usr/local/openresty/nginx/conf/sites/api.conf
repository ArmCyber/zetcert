server {
    listen 443 ssl;
    server_name api.example.com;
    include /etc/nginx/zetcert/api.conf;

    location / {
        access_by_lua_block {
            if ngx.var.remote_addr == "10.0.0.1" then
                return ngx.exit(403)  -- a ; and a } in a comment
            end
        }
        content_by_lua_file lua/content.lua;
        add_header X-Frame "sameorigin; \"quoted\"" always;
    }
}
